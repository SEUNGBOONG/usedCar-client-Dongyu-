name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 파일이 어디 있는지 확인 (디버깅용 - 에러 나면 로그 확인용)
      - name: List files
        run: ls -R

      # 2. application.properties 생성 (승계랜드님은 properties 형식이니 확장자 수정)
      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.properties

      # 3. Gradle 빌드 (파일 권한 강제 부여 추가)
      - name: Build with Gradle
        run: |
          find . -name gradlew -exec chmod +x {} +
          ./gradlew build -x test

      # 4. 도커 허브 로그인 및 이미지 빌드/푸시
      - name: Docker build & push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          # 이미지 태그를 소문자로 관리하는 것이 관례입니다.
          docker build -t ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest

      # 5. EC2에 SSH로 접속해서 컨테이너 교체
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest
            sudo docker stop seungyeland-api || true
            sudo docker rm seungyeland-api || true
            
            # 포트 8080 연결 및 컨테이너 실행
            sudo docker run -d --name seungyeland-api -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest
            
            # 안 쓰는 이미지 정리
            sudo docker image prune -f
