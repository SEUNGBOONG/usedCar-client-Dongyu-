name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. application.properties 생성
      - name: Create application.properties
        run: |
          mkdir -p dongyuCar/src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > dongyuCar/src/main/resources/application.properties

      # 2. Gradle 빌드
      - name: Build with Gradle
        working-directory: ./dongyuCar
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      # 3. 도커 허브 로그인 및 이미지 빌드/푸시
      - name: Docker build & push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest ./dongyuCar
          docker push ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest

      # 4. EC2에 SSH로 접속해서 컨테이너 교체 (가장 정확한 순서)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            # 1. 최신 이미지 먼저 다운로드
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest
            
            # 2. 기존 컨테이너 중지 및 삭제
            sudo docker stop seungyeland-api || true
            sudo docker rm seungyeland-api || true
            
            # 3. 새 컨테이너 실행 (항상 재시작 옵션 추가)
            sudo docker run -d \
              --name seungyeland-api \
              -p 8080:8080 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/seungyeland:latest
            
            # 4. 사용하지 않는 구형 이미지들 삭제
            sudo docker image prune -f
