name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub Secrets에 넣은 application.yml 내용을 파일로 생성
      - name: Create application.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yml

      # Gradle 빌드 (테스트는 제외하고 빌드 속도를 높임)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      # 도커 허브 로그인 및 이미지 빌드/푸시
      - name: Docker build & push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/seungyeland .
          docker push ${{ secrets.DOCKER_USERNAME }}/seungyeland

      # EC2에 SSH로 접속해서 컨테이너 교체
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            # 기존 컨테이너 중지 및 삭제 (이미 실행 중일 때만)
            docker pull ${{ secrets.DOCKER_USERNAME }}/seungyeland
            docker stop seungyeland-api || true
            docker rm seungyeland-api || true
            
            # 새 컨테이너 실행 (8080 포트 연결)
            docker run -d --name seungyeland-api -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/seungyeland
            
            # 사용하지 않는 이미지 정리 (용량 확보)
            docker image prune -f
